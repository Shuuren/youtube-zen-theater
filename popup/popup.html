<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>YouTube Zen Theater</title>
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <rect x="3" y="5" width="26" height="18" rx="3"></rect>
            <path d="M14 11l8 4-8 5z"></path>
            <path d="M7 27h18"></path>
          </svg>
        </div>
        <div>
          <h1>YouTube Zen</h1>
          <p>Fullscreen theater controls</p>
        </div>
      </header>

      <section class="settings" aria-label="Settings">
        <fieldset class="group">
          <legend>Playback</legend>
          <label class="row">
            <span>
              <strong>Auto Zen</strong>
              <small>Apply automatically on videos</small>
            </span>
            <input type="checkbox" id="autoZen">
          </label>

          <label class="row">
            <span>
              <strong>T shortcut</strong>
              <small>Toggle Zen like theater mode</small>
            </span>
            <input type="checkbox" id="shortcutEnabled">
          </label>
        </fieldset>

        <fieldset class="group">
          <legend>Content</legend>
          <label class="row">
            <span>
              <strong>Live chat</strong>
              <small>Click YouTube's native close control</small>
            </span>
            <input type="checkbox" id="hideLiveChat">
          </label>

          <label class="row">
            <span>
              <strong>Top bar</strong>
              <small>Remove search, profile, and nav</small>
            </span>
            <input type="checkbox" id="hideHeader">
          </label>

          <label class="row">
            <span>
              <strong>Recommendations</strong>
              <small>Keep only video and below content</small>
            </span>
            <input type="checkbox" id="hideRecommendations">
          </label>
        </fieldset>

        <fieldset class="group">
          <legend>Reveal</legend>
          <label class="row">
            <span>
              <strong>Top hover</strong>
              <small>Show top bar at the upper edge</small>
            </span>
            <input type="checkbox" id="revealHeaderOnHover">
          </label>

          <label class="row">
            <span>
              <strong>Side details</strong>
              <small>Show title, channel, and comments</small>
            </span>
            <input type="checkbox" id="revealMetaOnHover">
          </label>

          <label class="row">
            <span>
              <strong>Playlist</strong>
              <small>Show queue and playlist panel</small>
            </span>
            <input type="checkbox" id="revealPlaylistOnHover">
          </label>

          <label class="row">
            <span>
              <strong>Open style</strong>
              <small>Choose hover edge or drawer button</small>
            </span>
            <select id="sideRevealMode">
              <option value="drawer">Drawer</option>
              <option value="hover">Hover</option>
            </select>
          </label>

          <details class="advanced">
            <summary>Advanced reveal tuning</summary>
            <div class="advanced-grid">
              <label class="row compact-row">
                <span>
                  <strong>Panel sides</strong>
                  <small>Use one edge or both edges</small>
                </span>
                <select id="revealSideLayout">
                  <option value="separate">Separate</option>
                  <option value="same">Same side</option>
                </select>
              </label>

              <label class="row compact-row">
                <span>
                  <strong data-side-position-title>Details side</strong>
                  <small data-side-position-help>Playlist uses the opposite side</small>
                </span>
                <select id="sideHoverPosition">
                  <option value="right">Right</option>
                  <option value="left">Left</option>
                </select>
              </label>

              <label class="row compact-row same-side-setting" data-same-side-only>
                <span>
                  <strong>Same-side split</strong>
                  <small>Choose the top hover half</small>
                </span>
                <select id="sameSideSplit">
                  <option value="playlist-top">Playlist top</option>
                  <option value="details-top">Details top</option>
                </select>
              </label>

              <label class="row compact-row range-row">
                <span>
                  <strong>Hover delay</strong>
                  <small><output data-range-value="hoverRevealDelay">140ms</output></small>
                </span>
                <input type="range" id="hoverRevealDelay" min="0" max="1000" step="20">
              </label>
            </div>
          </details>
        </fieldset>

        <fieldset class="group">
          <legend>Appearance</legend>
          <label class="row">
            <span>
              <strong>Drawer build</strong>
              <small>Use Zen drawer or YouTube surface</small>
            </span>
            <select id="drawerImplementation">
              <option value="custom">Zen</option>
              <option value="native">Native</option>
            </select>
          </label>

          <label class="row">
            <span>
              <strong>Liquid glass</strong>
              <small>Transparent blur effect</small>
            </span>
            <input type="checkbox" id="drawerGlassEffect">
          </label>
        </fieldset>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
