<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>YouTube Zen Theater</title>
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <rect x="3" y="5" width="26" height="18" rx="3"></rect>
            <path d="M14 11l8 4-8 5z"></path>
            <path d="M7 27h18"></path>
          </svg>
        </div>
        <div>
          <h1>YouTube Zen</h1>
          <p>Fullscreen theater controls</p>
        </div>
      </header>

      <section class="settings" aria-label="Settings">
        <label class="row">
          <span>
            <strong>Auto Zen</strong>
            <small>Apply automatically on videos</small>
          </span>
          <input type="checkbox" id="autoZen">
        </label>

        <label class="row">
          <span>
            <strong>Hide live chat</strong>
            <small>Click YouTube's native close control</small>
          </span>
          <input type="checkbox" id="hideLiveChat">
        </label>

        <label class="row">
          <span>
            <strong>Hide top bar</strong>
            <small>Remove search, profile, and nav</small>
          </span>
          <input type="checkbox" id="hideHeader">
        </label>

        <label class="row">
          <span>
            <strong>Top hover reveal</strong>
            <small>Show top bar at the upper edge</small>
          </span>
          <input type="checkbox" id="revealHeaderOnHover">
        </label>

        <label class="row">
          <span>
            <strong>Side hover reveal</strong>
            <small>Show title, channel, and comments</small>
          </span>
          <input type="checkbox" id="revealMetaOnHover">
        </label>

        <label class="row">
          <span>
            <strong>Panel side</strong>
            <small>Choose the hover edge</small>
          </span>
          <select id="sideHoverPosition">
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </label>

        <label class="row">
          <span>
            <strong>Hide recommendations</strong>
            <small>Keep only video and below content</small>
          </span>
          <input type="checkbox" id="hideRecommendations">
        </label>

        <label class="row">
          <span>
            <strong>T shortcut</strong>
            <small>Toggle Zen like theater mode</small>
          </span>
          <input type="checkbox" id="shortcutEnabled">
        </label>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
